name: tests

on:
  push:
  pull_request:

jobs:
  pruned-evidence-gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run evaluator
        env:
          PYTHONPATH: code
        run: python code/pruned_evidence_gate.py
      - name: Run tests
        env:
          PYTHONPATH: code
        run: python -m pytest code -q

